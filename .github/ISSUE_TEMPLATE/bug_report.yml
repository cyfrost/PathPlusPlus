name: Bug report
description: Something in Path++ doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Path++ version
      description: Run `pathpp version`, or check Settings > Apps.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run `winver`.
      placeholder: "Windows 11 24H2 (26100)"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is it installed?
      options:
        - Just for me (per-user)
        - All users
        - Portable zip
  - type: textarea
    id: path
    attributes:
      label: Relevant PATH entries or command output
      description: Please remove anything private (user names, internal server names).
      render: text
